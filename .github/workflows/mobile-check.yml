name: Cere Mobile checks
on:
  pull_request:
    paths: ['mobile/**', 'broker/**', 'protocol/**', 'tests/**', 'tools/mobile-*', 'package*.json', 'tsconfig*.json', '.github/workflows/mobile-*.yml']
  push:
    branches: [main, master]
    paths: ['mobile/**', 'broker/**', 'protocol/**', 'tests/**', 'tools/mobile-*', 'package*.json', 'tsconfig*.json', '.github/workflows/mobile-*.yml']
  workflow_call:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.mobile.json
      - run: node tools/mobile-contract.ts --check
      - name: Build same-user peer credentials adapter for isolated process tests
        run: |
          mkdir -p build
          curl --fail --silent --show-error "https://nodejs.org/dist/v$(node --version | cut -c2-)/node-$(node --version)-headers.tar.gz" -o /tmp/node-headers.tar.gz
          tar -xzf /tmp/node-headers.tar.gz -C /tmp
          g++ -std=c++17 -shared -fPIC -I"/tmp/node-$(node --version)/include/node" native/peercred.cpp -o build/cere-peercred.node
      - run: node --test tests/remote.test.ts tests/remote-rate-limits.test.ts tests/remote-process.test.ts tests/send-queue.test.ts tests/core.test.ts tests/providers.test.ts tests/ollama.test.ts tests/desktop.test.ts tests/memory.test.ts
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew --no-daemon :core:protocol:test :core:data:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:lintDev :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:assembleDev
      - run: ./gradlew --no-daemon --no-configuration-cache -I ../../tools/mobile-sbom.gradle :app:mobileSbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cere-mobile-unsigned
          if-no-files-found: error
          path: |
            mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
            mobile/android/app/build/reports/mobile-sbom.cdx.json
            mobile/android/app/build/reports/lint-results-*.html
          retention-days: 14
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Instrumentation tests that need a paired desktop skip themselves without their explicit arguments.
      # The R8-optimized development build is then installed and launched to catch shrinking crashes.
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: mobile/android
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest :app:assembleDev
            adb install -r app/build/outputs/apk/dev/app-dev.apk
            adb shell am start -W -n dev.otectus.cere.mobile.debug/dev.otectus.cere.mobile.MainActivity
            sleep 5
            adb shell pidof dev.otectus.cere.mobile.debug
